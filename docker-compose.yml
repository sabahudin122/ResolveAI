services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - "5432:5432"
    volumes:
      - opspilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:8080
      DATABASE_URL: postgresql://opspilot:opspilot@postgres:5432/opspilot?schema=public
      JWT_ACCESS_SECRET: replace_with_a_long_access_secret_for_docker
      JWT_REFRESH_SECRET: replace_with_a_long_refresh_secret_for_docker
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_DAYS: 14
      BCRYPT_ROUNDS: 12
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-4o-mini
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  opspilot-postgres:
