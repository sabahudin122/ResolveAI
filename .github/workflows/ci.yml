name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://opspilot:opspilot@localhost:5432/opspilot_test?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_that_is_long_enough
      JWT_REFRESH_SECRET: ci_refresh_secret_that_is_long_enough
      CORS_ORIGIN: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run db:push -w apps/api
      - run: npm run db:seed -w apps/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
